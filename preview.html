      const StarfieldBackground = () => {
        const canvasRef = useRef(null);
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animationFrameId;
          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const handleResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener('resize', handleResize);

          const starCount = Math.min(Math.floor((width * height) / 7000), 220);
          const stars = Array.from({ length: starCount }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.65 + 0.35,
            alpha: Math.random() * 0.8 + 0.2,
            deltaAlpha: (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
            speedY: Math.random() * 0.18 + 0.04,
            speedX: (Math.random() - 0.5) * 0.06,
            isBlue: Math.random() > 0.65,
          }));

          let shootingStar = null;
          const spawnShootingStar = () => {
            if (Math.random() < 0.008 && !shootingStar) {
              shootingStar = {
                x: Math.random() * width * 0.8 + width * 0.1,
                y: Math.random() * height * 0.35,
                length: Math.random() * 90 + 60,
                speed: Math.random() * 9 + 7,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                opacity: 1,
              };
            }
          };

          const render = () => {
            ctx.clearRect(0, 0, width, height);
            for (const star of stars) {
              star.alpha += star.deltaAlpha;
              if (star.alpha <= 0.15 || star.alpha >= 0.95) star.deltaAlpha = -star.deltaAlpha;
              star.y -= star.speedY;
              star.x += star.speedX;
              if (star.y < 0) star.y = height;
              if (star.x < 0) star.x = width;
              if (star.x > width) star.x = 0;

              ctx.beginPath();
              ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
              if (star.isBlue) {
                ctx.fillStyle = `rgba(91, 142, 245, ${star.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#2c67ed';
              } else {
                ctx.fillStyle = `rgba(248, 250, 252, ${star.alpha})`;
                ctx.shadowBlur = 0;
              }
              ctx.fill();
            }

            spawnShootingStar();
            if (shootingStar) {
              const tailX = shootingStar.x - Math.cos(shootingStar.angle) * shootingStar.length;
              const tailY = shootingStar.y - Math.sin(shootingStar.angle) * shootingStar.length;
              const gradient = ctx.createLinearGradient(shootingStar.x, shootingStar.y, tailX, tailY);
              gradient.addColorStop(0, `rgba(91, 142, 245, ${shootingStar.opacity})`);
              gradient.addColorStop(0.4, `rgba(44, 103, 237, ${shootingStar.opacity * 0.6})`);
              gradient.addColorStop(1, 'rgba(44, 103, 237, 0)');
              ctx.beginPath();
              ctx.moveTo(shootingStar.x, shootingStar.y);
              ctx.lineTo(tailX, tailY);
              ctx.strokeStyle = gradient;
              ctx.lineWidth = 2;
              ctx.stroke();
              shootingStar.x += Math.cos(shootingStar.angle) * shootingStar.speed;
              shootingStar.y += Math.sin(shootingStar.angle) * shootingStar.speed;
              shootingStar.opacity -= 0.018;
              if (shootingStar.opacity <= 0 || shootingStar.x > width || shootingStar.y > height) {
                shootingStar = null;
              }
            }
            animationFrameId = requestAnimationFrame(render);
          };
          render();
          return () => {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', handleResize);
          };
        }, []);

                          ? 'bg-[#2c67ed] text-white shadow-[0_0_20px_rgba(44,103,237,0.75)]'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <span>{tab.label}</span>
                      <span
                        className={`px-2 py-0.5 rounded-full text-[11px] font-mono ${
                          isSelected ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'
                        }`}
                      >
                        {tab.count}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {activeTab === 'businessCases' && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-7">
                {portfolioTabs.businessCases.map((project) => (
                  <div key={project.id} className="space-card rounded-3xl p-6 sm:p-8 flex flex-col justify-between">
                    <div>
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <span className="px-3 py-1 rounded-full bg-[#2c67ed]/20 border border-[#2c67ed]/40 text-[#5b8ef5] text-xs font-semibold">
                          {project.category}
                        </span>
                        <span className="font-mono text-xs text-slate-300 bg-[#070b14] border border-slate-800 px-3 py-1 rounded-full">
                          {project.highlightMetric}
                        </span>
                      </div>
                      <h3 className="font-display text-xl sm:text-2xl font-bold text-white mb-1.5">{project.title}</h3>
                      <p className="text-xs sm:text-sm font-medium text-[#5b8ef5] mb-4">{project.subtitle}</p>
                      <p className="text-sm text-slate-300 leading-relaxed mb-5">{project.summary}</p>
                      <div className="space-y-2 mb-6">
                        {project.keyPoints.map((pt, idx) => (
                          <div key={idx} className="flex items-start gap-2.5 text-xs sm:text-sm text-slate-300">
                            <span className="text-[#2c67ed]">✓</span>
                            <span>{pt}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div>
                      <div className="grid grid-cols-3 gap-2.5 p-3.5 rounded-2xl bg-[#070b14]/90 border border-slate-800/90 mb-5">
                        {project.metrics.map((m, i) => (
                          <div key={i}>
                            <div className="text-[11px] text-slate-400">{m.label}</div>
                            <div className="text-xs sm:text-sm font-semibold text-white mt-0.5">{m.value}</div>
                          </div>
                        ))}
                      </div>
                      <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800/80">
                        <div className="flex flex-wrap gap-1.5">
                          {project.tags.map((tag, i) => (
                            <span
                              key={i}
                              className="px-2.5 py-1 rounded-lg bg-slate-900/90 border border-slate-800 text-[11px] text-slate-300"
                            >
                              #{tag}
                            </span>
                          ))}
                        </div>
                        {project.documentUrl && (
                          <a
                            href={project.documentUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#2c67ed]/20 hover:bg-[#2c67ed] text-[#5b8ef5] hover:text-white border border-[#2c67ed]/40 text-xs font-semibold transition-all"
                          >
                            <span>Buka Dokumen PDF ↗</span>
                          </a>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'awards' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {portfolioTabs.awards.map((award) => (
                  <div key={award.id} className="space-card rounded-3xl p-6 flex flex-col justify-between">
                    <div>
                      <div className="relative h-44 rounded-2xl overflow-hidden bg-[#070b14] border border-slate-800 mb-5 flex items-center justify-center">
                        {award.previewType === 'image' ? (
                          <img src={award.previewUrl} alt={award.title} className="w-full h-full object-cover" />
                        ) : (
                          <div className="text-center p-6">
                            <div className="w-12 h-12 rounded-2xl bg-[#2c67ed]/20 border border-[#2c67ed]/50 flex items-center justify-center text-[#5b8ef5] mx-auto mb-2">
                              ★
                            </div>
                            <span className="text-xs font-mono text-[#5b8ef5]">Official Certificate PDF</span>
                          </div>
                        )}
                        <div className="absolute top-3 left-3">
                          <span className="px-3 py-1 rounded-full bg-[#03050a]/90 border border-[#2c67ed]/50 text-[#5b8ef5] text-[11px] font-semibold">
                            {award.badge}
                          </span>
                        </div>
                      </div>
                      <h3 className="font-display text-lg font-bold text-white mb-1.5">{award.title}</h3>
                      <div className="text-xs font-medium text-[#5b8ef5] mb-3">{award.issuer}</div>
                      <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-5">{award.description}</p>
                    </div>
                    <div className="pt-3 border-t border-slate-800/80">
                      <a
                        href={award.previewUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-[#2c67ed]/20 hover:bg-[#2c67ed] text-[#5b8ef5] hover:text-white border border-[#2c67ed]/40 text-xs font-semibold transition-all"
                      >
                        <span>Lihat Sertifikat ↗</span>
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'financialTools' && (
              <div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                  {portfolioTabs.financialTools.map((tool) => (
                    <div key={tool.id} className="space-card rounded-3xl p-6 sm:p-8 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-3">
                          <h3 className="font-display text-xl font-bold text-white">{tool.name}</h3>
                          <span className="px-2.5 py-0.5 rounded-full bg-[#2c67ed]/20 border border-[#2c67ed]/40 text-[#5b8ef5] text-[11px] font-semibold">
                            {tool.badge}
                          </span>
                        </div>
                        <div className="text-xs font-medium text-[#5b8ef5] mb-4">{tool.category}</div>
                        <p className="text-sm text-slate-300 leading-relaxed mb-5">{tool.description}</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-6">
                          {tool.capabilities.map((cap, idx) => (
                            <div
                              key={idx}
                              className="flex items-center gap-2 px-3 py-2 rounded-xl bg-[#070b14]/85 border border-slate-800 text-xs text-slate-200"
                            >
                              <span className="text-[#2c67ed]">✓</span>
                              <span>{cap}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div className="pt-4 border-t border-slate-800/80">
                        <div className="flex justify-between text-xs mb-2">
                          <span className="text-slate-400">Tingkat Penguasaan</span>
                          <span className="font-mono font-semibold text-[#5b8ef5]">{tool.level}</span>
                        </div>
                        <div className="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
                          <div
                            style={{ width: `${tool.percentage}%` }}
                            className="h-full rounded-full bg-gradient-to-r from-[#2c67ed] to-[#38bdf8] shadow-[0_0_12px_#2c67ed]"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </section>
        );
      };

      const Contact = () => {
        const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });
        const handleSubmit = (e) => {
          e.preventDefault();
          const mailtoSubject = encodeURIComponent(formData.subject || `Pesan Portfolio dari ${formData.name}`);
          const mailtoBody = encodeURIComponent(
            `Halo Aiza El Diana,\n\nNama: ${formData.name}\nEmail: ${formData.email}\n\nPesan:\n${formData.message}`
          );
          window.open(`mailto:${profileData.email}?subject=${mailtoSubject}&body=${mailtoBody}`, '_blank');
        };

        return (
          <section id="contact" className="relative z-10 py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
            <div className="text-center mb-16">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#2c67ed]/15 border border-[#2c67ed]/40 text-[#5b8ef5] text-xs font-semibold uppercase tracking-wider mb-4">
                ✦ Get In Touch
              </div>
              <h2 className="font-display text-3xl sm:text-5xl font-bold text-white tracking-tight mb-4">
                Mari <span className="text-[#2c67ed]">Terhubung</span> & Berkolaborasi
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-5 space-card rounded-3xl p-6 sm:p-8 flex flex-col justify-between">
                <div className="space-y-4">
                  <h3 className="font-display text-xl font-bold text-white mb-2">Informasi Kontak & Sosial Media</h3>
                  <a
                    href={profileData.linkedin}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block p-4 rounded-2xl bg-[#070b14]/90 border border-slate-800 hover:border-[#2c67ed] transition-all"
                  >
                    <div className="text-xs text-slate-400">LinkedIn</div>
                    <div className="text-sm font-semibold text-[#5b8ef5]">linkedin.com/in/aiza-diana-59169830b ↗</div>
                  </a>
                  <a
                    href={`mailto:${profileData.email}`}
                    className="block p-4 rounded-2xl bg-[#070b14]/90 border border-slate-800 hover:border-[#2c67ed] transition-all"
                  >
                    <div className="text-xs text-slate-400">Email</div>
                    <div className="text-sm font-semibold text-white">{profileData.email}</div>
                  </a>
                  <a
                    href="https://wa.me/6281398721976"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block p-4 rounded-2xl bg-[#070b14]/90 border border-slate-800 hover:border-[#2c67ed] transition-all"
                  >
                    <div className="text-xs text-slate-400">Telepon / WhatsApp</div>
                    <div className="text-sm font-semibold text-white">{profileData.phone}</div>
                  </a>
                </div>
                <div className="mt-6 pt-6 border-t border-slate-800">
                  <a
                    href={profileData.cvUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full block text-center py-3.5 px-5 rounded-2xl bg-[#2c67ed]/20 hover:bg-[#2c67ed] border border-[#2c67ed]/50 text-[#5b8ef5] hover:text-white font-semibold text-sm transition-all"
                  >
                    Lihat & Unduh Curriculum Vitae (PDF)
                  </a>
                </div>
              </div>

              <div className="lg:col-span-7 space-card rounded-3xl p-6 sm:p-8">
                <h3 className="font-display text-xl font-bold text-white mb-4">Kirim Pesan Langsung</h3>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input
                      type="text"
                      required
                      placeholder="Nama Lengkap"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-[#070b14] border border-slate-800 focus:border-[#2c67ed] focus:outline-none text-sm text-white"
                    />
                    <input
                      type="email"
                      required
                      placeholder="Alamat Email"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-[#070b14] border border-slate-800 focus:border-[#2c67ed] focus:outline-none text-sm text-white"
                    />
                  </div>
                  <input
                    type="text"
                    required
                    placeholder="Subjek / Keperluan"
                    value={formData.subject}
                    onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                    className="w-full px-4 py-3 rounded-xl bg-[#070b14] border border-slate-800 focus:border-[#2c67ed] focus:outline-none text-sm text-white"
                  />
                  <textarea
                    rows="5"
                    required
                    placeholder="Tuliskan pesan Anda..."
                    value={formData.message}
                    onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                    className="w-full px-4 py-3 rounded-xl bg-[#070b14] border border-slate-800 focus:border-[#2c67ed] focus:outline-none text-sm text-white"
                  />
                  <button
                    type="submit"
                    className="w-full py-4 rounded-xl bg-[#2c67ed] hover:bg-[#1d4ed8] text-white font-semibold text-sm shadow-[0_0_25px_rgba(44,103,237,0.6)] transition-all"
                  >
                    Kirim Pesan Sekarang
                  </button>
                </form>
              </div>
            </div>
          </section>
        );
      };

      const App = () => (
        <div className="relative min-h-screen bg-[#03050a] text-slate-100">
          <StarfieldBackground />
          <Navbar />
          <main className="relative z-10">
            <Hero />
            <About />
            <Portfolio />
            <Contact />
          </main>
          <footer className="relative z-10 border-t border-slate-800/80 bg-[#03050a]/90 py-8 px-4 text-center text-xs text-slate-500">
            © {new Date().getFullYear()} Aiza El Diana Suprayogi — D4 Keuangan dan Perbankan Syariah, Politeknik Negeri Jakarta.
          </footer>
        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
